name: CI

# Runs on every pull request and on pushes to main. Nothing here logs in to Azure, pushes an
# image, or deploys anything; deployment is the separate, manual deploy-azure.yml workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '24'
  # Same Bicep CLI version as the local validation recorded in docs/AZURE.md.
  BICEP_VERSION: v0.48.1

jobs:
  validate:
    name: Validate (format, lint, typecheck, test, build, audit, secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (fails on high severity or above)
        run: npm run audit:deps
        continue-on-error: false

      - name: Secret scan
        run: npm run scan:secrets

  e2e:
    name: End-to-end (Playwright, Chromium)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  bicep:
    name: Bicep (build and lint, local only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Bicep CLI (no Azure login is performed)
        run: |
          az config set bicep.use_binary_from_path=false
          az bicep install --version "${BICEP_VERSION}"
          az bicep version

      - name: Build
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
          # The production-mode path (bootstrap admin) with obviously fake values.
          BIGFORGE_AZURE_APP_MODE=production \
            BIGFORGE_AZURE_ADMIN_EMAIL=admin@example.invalid \
            BIGFORGE_AZURE_ADMIN_PASSWORD=not-a-real-password \
            az bicep build-params --file infra/main.bicepparam --stdout > /dev/null

      - name: Lint main.bicep and every module
        run: |
          status=0
          for file in infra/main.bicep infra/modules/*.bicep; do
            echo "::group::${file}"
            output="$(az bicep lint --file "${file}" 2>&1)" || status=1
            echo "${output}"
            echo "::endgroup::"
            # API-version age is reported as a warning that should not fail the build.
            if grep 'Warning' <<<"${output}" | grep -vq 'use-recent-api-versions'; then
              echo "::error file=${file}::Bicep reported warnings other than API-version age"
              status=1
            fi
          done
          exit "${status}"

  container:
    name: Container image (build, run, health check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image (not pushed)
        run: docker build --tag bigforge:ci .

      - name: Run the container and check health
        run: |
          docker run --detach --name bigforge-ci --publish 127.0.0.1:4747:4747 bigforge:ci

          if [[ "$(docker exec bigforge-ci id -u)" == "0" ]]; then
            echo "::error::The container runs as root"
            exit 1
          fi

          for path in /api/health /api/ready; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:4747${path}"; then
                echo
                break
              fi
              if [[ "${attempt}" -eq 30 ]]; then
                echo "::error::${path} did not return success within 60 seconds"
                exit 1
              fi
              sleep 2
            done
          done

          # The Dockerfile HEALTHCHECK runs every 30 seconds; wait for its first passing result.
          for attempt in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' bigforge-ci)"
            echo "docker health status: ${status}"
            if [[ "${status}" == "healthy" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The Docker HEALTHCHECK did not report healthy within 90 seconds"
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs bigforge-ci || true

      - name: Remove container
        if: always()
        run: docker rm --force bigforge-ci || true
